<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beauty Battle - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="auth-container" class="container">
    <div class="auth-box">
      <h1 class="logo">Beauty Battle</h1>
      <p class="subtitle">Entre e comece a competir!</p>
      <div class="input-group">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Senha" required>
      </div>
      <button onclick="signIn()" class="btn primary-btn">Entrar</button>
      <button onclick="goToSignUp()" class="btn secondary-btn">Cadastrar</button>
      <p id="auth-message" class="message"></p>
    </div>
  </div>

  <!-- Firebase SDKs (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
